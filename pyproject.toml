[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-context"
version = "0.1.0"
description = "AI Context Engine — structured project context for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "AI Context Engine Contributors" },
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.scripts]
ai-context = "ai_context.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_return_any = true
warn_unused_configs = true
